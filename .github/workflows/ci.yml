name: CI
on:
  pull_request:
  push:
    branches: [main]

# Deux jobs : `checks` (lint, typecheck, migration, tests unitaires) et `e2e`, les tests d'écran
# découpés en trois parts sur trois machines. Chaque part a son propre Postgres : les tests
# restent joués un par un sur une base donnée (ils la partagent), mais trois bases tournent en
# même temps. `e2e` est sauté quand une PR ne change que de la documentation ; sur `main`, il
# tourne toujours. CRM-89.
env:
  DATABASE_URL: postgres://crm:crm@localhost:5433/crm
  TEST_DATABASE_URL: postgres://crm:crm@localhost:5433/crm_test
  APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        # Une PR dont tous les fichiers sont de la documentation (.pilot/, .claude/, .workflow/,
        # docs/, *.md) ne joue pas les tests d'écran. Un push sur main les joue toujours.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          # Pas de `grep -vq` : le grep BSD (macOS, pour rejouer en local) rend 1 dès qu'une ligne matche.
          if [ -n "$(echo "$files" | grep -Ev '^(\.pilot/|\.claude/|\.workflow/|docs/|[^/]*\.md$|.*/[^/]*\.md$)')" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql postgres://crm:crm@localhost:5433/crm -c "CREATE DATABASE crm_test;"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql postgres://crm:crm@localhost:5433/crm -c "CREATE DATABASE crm_test;"
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
