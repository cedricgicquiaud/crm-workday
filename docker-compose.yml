# Postgres de développement et de test.
#   docker compose up -d
# Deux bases : `crm` (développement) et `crm_test` (tests, remise à zéro à chaque exécution).
services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-workday-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
